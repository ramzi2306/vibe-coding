<title>AI Marketing Talk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one full-bleed 16:9 stage, slides crossfade, a quiet control bar under it */
:root { --bg: #030303; --ink: #f4f4f2; --mute: #9b9d96; --lime: #b3e621; --line: rgba(255,255,255,.16); color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; overflow: hidden; }
#stage { position: relative; flex: 1; min-height: 0; cursor: pointer; outline: none; }
#stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .45s ease; }
#stage img.on { opacity: 1; }
#bar { display: flex; align-items: center; gap: 12px; padding-top: 10px; font-size: 14px; color: var(--mute); }
#bar button { font: inherit; font-weight: 700; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
#bar button:hover, #bar button:focus-visible { border-color: var(--lime); color: var(--lime); outline: none; }
#count { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
#prog { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#prog i { display: block; height: 100%; width: 0; background: var(--lime); transition: width .3s ease; }
#hint { display: none; }
@media (min-width: 760px) { #hint { display: inline; } }
body.full #bar { display: none; }
body.full { padding: 0; }
@media (prefers-reduced-motion: reduce) { #stage img, #prog i { transition: none; } }
</style>
<div id="stage" tabindex="0" aria-label="Slides. Use the arrow keys to move."></div>
<div id="bar">
  <button id="prev" type="button" aria-label="Previous slide">Back</button>
  <span id="count">1 / 19</span>
  <button id="next" type="button" aria-label="Next slide">Next</button>
  <div id="prog"><i></i></div>
  <span id="hint">Arrow keys or click to move</span>
  <button id="fs" type="button">Fullscreen</button>
</div>
<script>
const N = 19, stage = document.getElementById('stage');
const imgs = Array.from({ length: N }, (_, i) => {
  const im = new Image();
  im.alt = 'Slide ' + (i + 1);
  im.src = 'slides/' + String(i + 1).padStart(2, '0') + '.jpg';
  stage.appendChild(im);
  return im;
});
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(N - 1, i));
  imgs.forEach((im, k) => im.classList.toggle('on', k === cur));
  document.getElementById('count').textContent = (cur + 1) + ' / ' + N;
  document.querySelector('#prog i').style.width = ((cur + 1) / N * 100) + '%';
}
const next = () => show(cur + 1), prev = () => show(cur - 1);
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
stage.addEventListener('click', (e) => (e.clientX < stage.getBoundingClientRect().left + stage.clientWidth * 0.3 ? prev() : next()));
document.addEventListener('keydown', (e) => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(N - 1);
  else if (e.key === 'f' || e.key === 'F') full();
});
let x0 = null;
stage.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', (e) => { if (x0 === null) return; const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 40) (d < 0 ? next : prev)(); x0 = null; });
function full() {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
document.getElementById('fs').onclick = full;
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('full', !!document.fullscreenElement));
show(0);
stage.focus();
</script>
